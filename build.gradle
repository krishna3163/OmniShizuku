        'org.apache.commons:commons-lang3:3.21.0',
        'org.apache.httpcomponents:httpclient:4.5.14',
        'com.google.guava:guava:33.7.2-jre'
    )
}

plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    buildscript.configurations.classpath.resolutionStrategy.force(
        'org.bouncycastle:bcprov-jdk18on:1.86',
        'org.bouncycastle:bcpkix-jdk18on:1.86',
        'org.bouncycastle:bcutil-jdk18on:1.86',
        'org.jdom:jdom2:2.0.6.1',
        'org.bitbucket.b_c:jose4j:0.9.7',
        'org.apache.commons:commons-lang3:3.21.0',
        'org.apache.httpcomponents:httpclient:4.5.14',
        'com.google.guava:guava:33.7.2-jre'
    )
    configurations.configureEach {
        resolutionStrategy.force(
            'org.bouncycastle:bcprov-jdk18on:1.86',
            'org.bouncycastle:bcpkix-jdk18on:1.86',
            'org.bouncycastle:bcutil-jdk18on:1.86',
            'org.jdom:jdom2:2.0.6.1',
            'org.bitbucket.b_c:jose4j:0.9.7',
            'org.apache.commons:commons-lang3:3.21.0',
            'org.apache.httpcomponents:httpclient:4.5.14',
            'com.google.guava:guava:33.7.2-jre'
        )
    }
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            compileSdkMinor = 1
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 26
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = "dev"
def gitOutput = { List<String> arguments, String fallback ->
    try {
        def output = providers.exec {
            commandLine(['git'] + arguments)
            workingDir rootDir
        }.standardOutput.asText.get().trim()
        output ?: fallback
    } catch (Exception ignored) {
        fallback
    }
}
gitCommitId = gitOutput(['rev-parse', '--short', 'HEAD'], gitCommitId)

def gitCommitCount = gitOutput(['rev-list', '--count', 'HEAD'], '45').toInteger()

def defaultVersionName = "v0.0.2"
def baseVersionName = providers.gradleProperty("omniVersionName").getOrElse(defaultVersionName)
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}"
}
