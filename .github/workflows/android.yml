name: Android CI

on:
  push:
    branches: [ "main", "release/*", "security/*" ]
  pull_request:
    branches: [ "main", "release/*", "security/*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: 'recursive'
    - name: Validate Gradle Wrapper JARs
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Install Android SDK 37.1
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 --licenses > /dev/null 2>&1 || true
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865"
    - name: Test, lint, and build with Gradle
      run: ./gradlew :manager:testDebugUnitTest :manager:lintDebug :manager:assembleDebug --stacktrace --no-daemon

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: test-reports
        path: |
          manager/build/reports/tests/testDebugUnitTest/
          manager/build/test-results/testDebugUnitTest/
        if-no-files-found: ignore

    - name: Upload Lint Report
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: lint-reports
        path: |
          manager/build/reports/lint-results-debug.*
          manager/build/reports/lint-results-debug/
        if-no-files-found: ignore

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: manager-debug-apk
        path: manager/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
