name: Android Instrumentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null 2>&1
          set -o pipefail
          "$sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1" \
            "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :manager:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-instrumentation-reports
          path: |
            manager/build/outputs/androidTest-results/
            manager/build/reports/androidTests/
          if-no-files-found: warn
