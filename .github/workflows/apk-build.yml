name: Build Android APK

on:
  push:
    branches: [ "main", "dev", "nightly" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev", "nightly" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & Preview Components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" || true
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37" "$ANDROID_SDK_ROOT/platforms/android-37.0"
          fi

      - name: Configure signing
        if: env.TRUSTED_CONTEXT == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not configured - the APK falls back to debug signing."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
          {
            printf 'KEYSTORE_FILE=key.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Generate random debug keystore
        if: env.TRUSTED_CONTEXT != 'true' || env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
          cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null || true

      - name: Build debug APK
        run: |
          set -e -o pipefail
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Build release APK
        run: |
          set -e -o pipefail
          ./gradlew :manager:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "::group::Debug Build Log"
          tail -n 250 build-debug.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Release Build Log"
          tail -n 250 build-release.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Locate generated APKs
        if: always()
        run: |
          echo "=== FOUND APKS IN BUILD ==="
          find . -name "*.apk" 2>/dev/null || true

      - name: Verify APK signature
        if: always()
        run: |
          APK=$(find out/apk manager/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n1)
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" || true
            fi
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: omnishizuku-build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore

      - name: Upload all APKs as Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: omnishizuku-all-apks
          path: |
            out/apk/*.apk
            manager/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILES=$(find out/apk manager/build/outputs/apk -name "*.apk" 2>/dev/null | sort -u | tr '\n' ' ')
          echo "Discovered APK files: $APK_FILES"
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files found to publish!"
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="OmniShizuku ${RELEASE_TAG}"
            EXTRA_FLAGS=""
          else
            RELEASE_TAG="latest"
            RELEASE_TITLE="OmniShizuku Latest Release"
            EXTRA_FLAGS=""
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' exists. Updating release details and APK assets..."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease=false || true
            gh release upload "$RELEASE_TAG" $APK_FILES --clobber
          else
            echo "Creating release '$RELEASE_TAG'..."
            gh release create "$RELEASE_TAG" $APK_FILES \
              --title "$RELEASE_TITLE" \
              $EXTRA_FLAGS \
              --generate-notes
          fi


