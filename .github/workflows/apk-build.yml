name: Build Android APK

on:
  push:
    branches: [ "main", "dev", "nightly", "release/*" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "dev", "nightly", "release/*" ]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select build version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            VERSION="v1.0.0"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="v1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected OmniShizuku version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & Preview Components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1
          set -o pipefail
          "$SDKMANAGER" --channel=3 \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

      - name: Configure signing
        if: env.TRUSTED_CONTEXT == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not configured - the APK falls back to debug signing."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
          {
            printf 'KEYSTORE_FILE=key.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Generate random debug keystore
        if: env.TRUSTED_CONTEXT != 'true' || env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Run manager unit tests
        env:
          OMNI_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :manager:testDebugUnitTest "-PomniVersionName=${OMNI_VERSION_NAME}" --stacktrace --no-daemon

      - name: Build debug APK
        env:
          OMNI_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -e -o pipefail
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :manager:assembleDebug "-PomniVersionName=${OMNI_VERSION_NAME}" --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "::group::Debug Build Log"
          tail -n 250 build-debug.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Locate generated APKs
        if: always()
        run: |
          echo "=== FOUND APKS IN BUILD ==="
          find . -name "*.apk" 2>/dev/null || true

      - name: Verify APK signature
        if: success()
        run: |
          APK=$(find manager/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK" && test -f "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: omnishizuku-build-logs
          path: build-debug.log
          if-no-files-found: ignore

      - name: Upload debug APK as Artifact
        if: success()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: omnishizuku-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload debug APK for publishing
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: manager-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && !contains(github.ref_name, '-dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manager-debug-apk
          path: debug-apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          OMNI_VERSION_NAME: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p release-assets
          DEBUG_APK=$(find debug-apk -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated; refusing to publish an empty release."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            RELEASE_TAG="$OMNI_VERSION_NAME"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          RELEASE_TITLE="OmniShizuku ${RELEASE_TAG}"

          # Strictly ONE APK in release assets: the debug APK!
          APK_NAME="omnishizuku-${RELEASE_TAG}-debug.apk"
          cp "$DEBUG_APK" "release-assets/${APK_NAME}"

          RELEASE_ARGS=(--title "$RELEASE_TITLE" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_TAG" == *-dev ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' exists. Updating APK assets..."
            for asset in $(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'); do
              if [ "$asset" != "$APK_NAME" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done
            if [[ "$RELEASE_TAG" == *-dev ]]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease
            else
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease=false --latest
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
          else
            echo "Creating release '$RELEASE_TAG'..."
            gh release create "$RELEASE_TAG" "${RELEASE_ARGS[@]}" release-assets/*.apk
          fi

          mkdir -p latest-assets
          LATEST_APK_NAME="omnishizuku-latest-debug.apk"
          cp "$DEBUG_APK" "latest-assets/${LATEST_APK_NAME}"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            for asset in $(gh release view latest --json assets -q '.assets[].name'); do
              if [ "$asset" != "$LATEST_APK_NAME" ]; then
                gh release delete-asset latest "$asset" --yes
              fi
            done
            gh release edit latest \
              --title "OmniShizuku Latest Build (${RELEASE_TAG})" \
              --notes "Automated build from commit ${GITHUB_SHA} (${RELEASE_TAG}). Debug APK: [${LATEST_APK_NAME}](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${LATEST_APK_NAME})" \
              --latest
            gh release upload latest latest-assets/*.apk --clobber
          else
            gh release create latest latest-assets/*.apk \
              --title "OmniShizuku Latest Build (${RELEASE_TAG})" \
              --notes "Automated build from commit ${GITHUB_SHA} (${RELEASE_TAG}). Debug APK: [${LATEST_APK_NAME}](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${LATEST_APK_NAME})" \
              --target "$GITHUB_SHA" \
              --latest
          fi
