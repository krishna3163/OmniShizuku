name: Create latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v14.5.0). Created from <ref> when it does not exist yet."
        required: true
        type: string
      title:
        description: "Release title (defaults to the tag)."
        required: false
        default: ""
        type: string
      notes:
        description: "Release notes (Markdown). Leave empty to generate them from commits and merged PRs."
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref the release points at."
        required: false
        default: "main"
        type: string
      prerelease:
        description: "Mark as pre-release (a pre-release is never marked as Latest)."
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  owner-gate:
    name: Repository owner check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject everyone but the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          actor="${ACTOR,,}"
          owner="${OWNER,,}"
          if [ -z "$actor" ] || [ "$actor" != "$owner" ]; then
            echo "::error::Releases are restricted to the repository owner ($OWNER). '$ACTOR' is a collaborator or contributor."
            exit 1
          fi
          echo "Repository owner verified: $ACTOR"

  release:
    name: Build & publish release
    needs: owner-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid tag name: '$TAG'"
              exit 1
              ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 --licenses > /dev/null 2>&1 || true
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
            {
              printf 'KEYSTORE_FILE=key.jks\n'
              printf 'KEYSTORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
              printf 'KEYSTORE_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
              printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
            } > signing.properties
          else
            echo "::warning::Release keystore secrets not configured, generating fallback debug keystore for signing."
            mkdir -p ~/.android ~/.config/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null || true
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :manager:assembleRelease :manager:assembleDebug --stacktrace

      - name: Rename APKs for Release
        run: |
          mkdir -p release-assets
          for f in manager/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] && cp "$f" "release-assets/omnishizuku-${{ inputs.tag }}-release.apk"
          done
          for f in manager/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] && cp "$f" "release-assets/omnishizuku-${{ inputs.tag }}-debug.apk"
          done

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          REF: ${{ inputs.ref }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=( "$TAG" --target "$REF" )
          if [ -n "$TITLE" ]; then
            args+=( --title "$TITLE" )
          else
            args+=( --title "$TAG" )
          fi
          if [ -n "$NOTES" ]; then
            args+=( --notes "$NOTES" )
          else
            args+=( --generate-notes )
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=( --prerelease )
          else
            args+=( --latest )
          fi
          gh release create "${args[@]}" release-assets/*.apk
