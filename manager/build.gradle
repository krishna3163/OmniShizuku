afterEvaluate {
    ['debug', 'release'].each { buildType ->
        def buildTypeCapitalized = buildType.capitalize()
        tasks.getByName("pre${buildTypeCapitalized}Build").dependsOn(":shell:copy${buildTypeCapitalized}ShellDex")
        tasks.getByName("merge${buildTypeCapitalized}Assets").dependsOn(":shell:copy${buildTypeCapitalized}ShellDex")
        tasks.getByName("pre${buildTypeCapitalized}Build").dependsOn(":stub:copy${buildTypeCapitalized}StubApk")
        tasks.getByName("merge${buildTypeCapitalized}Assets").dependsOn(":stub:copy${buildTypeCapitalized}StubApk")

        def copyApk = tasks.register("copy${buildTypeCapitalized}ManagerApk") {
            mustRunAfter("assemble${buildTypeCapitalized}")
            doLast {
                def versionName = rootProject.ext.versionName
                def versionPrefix = versionName.startsWith("v") ? versionName : "v${versionName}"
                def apkDir = layout.buildDirectory.dir("outputs/apk/${buildType}").get().asFile
                def apk = fileTree(apkDir) { include '*.apk' }.files.find { it.name.endsWith('.apk') }
                if (apk == null) {
                    throw new GradleException("Manager ${buildType} APK was not found")
                }
                copy {
                    from apk
                    into rootProject.layout.projectDirectory.dir('out/apk')
                    rename { "omnishizuku-${versionPrefix}-${buildType}.apk" }
                }
                if (buildType == 'release') {
                    def mapping = layout.buildDirectory.file("outputs/mapping/release/mapping.txt").get().asFile
                    if (mapping.exists()) {
                        copy {
                            from mapping
                            into rootProject.layout.projectDirectory.dir('out/mapping')
                            rename { "mapping-${versionName}.txt" }
                        }
                    }
                }
            }
        }
        tasks.getByName("assemble${buildTypeCapitalized}").finalizedBy(copyApk)
    }
}

